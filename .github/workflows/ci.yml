name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar
        run: cmake --build build --parallel
